[package]
name = "battery_tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Native Windows HID battery tray"

[lib]
name = "battery_tray"
path = "src/lib.rs"

[[bin]]
name = "battery-tray"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "bmp"] }
native-windows-gui = { version = "1.0.12", default-features = false, features = [
    "file-dialog",
    "timer",
    "notice",
    "list-view",
    "cursor",
    "image-decoder",
    "listbox",
    "combobox",
    "tray-notification",
    "message-window",
    "clipboard",
    "menu",
    "textbox"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
windows = { version = "0.58", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging"
] }
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
